[project]
name = "kingdee-knowledge-kit"
# 单一真源:与 src/kd/_impl/_config.py 的 VERSION 保持一致 —— **当前 6.9**
# (下面的 `version` 字段即它的 PEP 440 三段写法;改版本号只改 _config.py 那一处)。
# 再下面这段是**历史变更说明**,不随版本号更新 —— 版本口径以上一句为准。
# 6.9 = 删顶层 `total`(2026-10-01)**破坏性变更**:顶层返回体不再带 `total`(它没有任何
# 可行动的用法,而文档明写「比对检索效果只看金标位次」),连带删除上游 `totalElements`
# 读取链;差额由 `otherSkipped`/`keywordsDropped`/`routeErrors` 承担。
# 6.6 = 检索词生成权移交调用层(ADR-0016,2026-09-28)**破坏性变更**:内核不再生成任何
# 检索词(拆词器/路序表/截断优先级删除)、CLI 删位置参数与 --type/--max-routes/--budget/--chunk、
# 预算机制删除、--product 三态收两态、清单字段集按类型声明(6.7 补齐 `other` 档后为四份)、
# read 截断改字符串枚举。
version = "6.9.0"
description = "kd — 金蝶官方知识库检索 CLI(匿名免费:零账号/零点数/零模型)。只出帖级标题清单(search)与全文(read),不做任何排序评分;合成权在调用方 agent。"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Drivpe" }]
keywords = ["kingdee", "k3cloud", "苍穹", "星空", "knowledge", "search", "cli", "agent"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Drivpe/kingdee-knowledge-kit"
Repository = "https://github.com/Drivpe/kingdee-knowledge-kit"

[project.scripts]
kd = "kd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# contract.json 是**唯一**的包内数据文件(v6.6,ADR-0016):对外返回体的单一来源
# (字段集四份/禁止键/产品线编号表/内核运行参数 limits),代码与测试都读它。
# 原 query_routes.json 随拆词器与预算机制删除,其仍有效的两个值(路数上限、限速档)
# 已并入 contract.json 的 limits 段。缺 contract.json 则内核静默退回内置兜底值
# ——装出来的行为与开发中的不是同一个东西。必须随包分发。
[tool.setuptools.package-data]
kd = ["contract.json"]
